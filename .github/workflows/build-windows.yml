name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore MAUI workload
        run: dotnet workload install maui

      - name: Restore project
        run: dotnet restore SafaaAndMarwaSystem.csproj

      - name: Publish Windows x64
        run: >
          dotnet publish SafaaAndMarwaSystem.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -o ./publish/win-x64

      - name: Package output
        shell: pwsh
        run: |
          if (!(Test-Path ./publish/win-x64/SafaaAndMarwaSystem.exe)) {
            throw "Expected application EXE was not produced."
          }
          Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./SafaaMarwa-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafaaMarwa-Windows-x64
          path: ./SafaaMarwa-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
